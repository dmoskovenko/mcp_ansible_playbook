# MCP server configuration
# Toggle which servers to install
mcp_servers_enabled:
  - exa
  - firecrawl
  - figma
  - context7
  - cupertino
  - swiftlens
  - xcodebuildmcp

# Agent skills toggle
skills_enabled: true

# Skill repositories to clone and symlink
skill_repos:
  - git@github.com:AvdLee/Core-Data-Agent-Skill.git
  - git@github.com:Dimillian/Skills.git
  - git@github.com:AvdLee/Swift-Concurrency-Agent-Skill.git
  - git@github.com:AvdLee/Swift-Testing-Agent-Skill.git
  - git@github.com:AvdLee/SwiftUI-Agent-Skill.git
  - git@github.com:glittercowboy/taches-cc-resources.git

# CLI casks (installed by prerequisites role)
claude_code_cask: claude-code
codex_cask: codex

# Exa tool whitelist (passed as --tools= to both CLIs)
exa_tools:
  - web_search_exa
  - web_search_advanced_exa
  - get_code_context_exa
  - crawling_exa
  - company_research_exa
  - people_search_exa
  - deep_researcher_start
  - deep_researcher_check

# Structured MCP server definitions
# Each entry supports: runner (npx/uvx/binary/http), env, command,
# transport, homebrew, codex (bool), claude_extra_args, codex_extra_args
mcp_servers:
  exa:
    name: exa
    runner: npx
    env:
      key: EXA_API_KEY
      value: "{{ vault_exa_api_key | default('') }}"
    command:
      - npx
      - -y
      - exa-mcp-server
    claude_extra_args:
      - "--tools={{ exa_tools | join(',') }}"
    codex_extra_args:
      - "--tools={{ exa_tools | join(',') }}"

  firecrawl:
    name: firecrawl
    runner: npx
    env:
      key: FIRECRAWL_API_KEY
      value: "{{ vault_firecrawl_api_key | default('') }}"
    command:
      - npx
      - -y
      - firecrawl-mcp

  figma:
    name: figma
    runner: http
    transport: http
    url: "https://mcp.figma.com/mcp"
    codex: false

  context7:
    name: context7
    runner: npx
    env:
      key: CONTEXT7_API_KEY
      value: "{{ vault_context7_api_key | default('') }}"
    command:
      - npx
      - -y
      - "@upstash/context7-mcp"

  cupertino:
    name: cupertino
    runner: binary
    transport: stdio
    homebrew:
      tap: mihaelamj/tap
      formula: cupertino
      binary: cupertino
    command:
      - "{{ homebrew_prefix }}/bin/cupertino"

  swiftlens:
    name: swiftlens
    runner: uvx
    transport: stdio
    command:
      - uvx
      - --python
      - "3.13"
      - swiftlens

  xcodebuildmcp:
    name: xcodebuildmcp
    runner: npx
    command:
      - npx
      - -y
      - xcodebuildmcp@latest
      - mcp
