---
- name: Verify XcodeBuildMCP in Claude
  ansible.builtin.command:
    argv:
      - "{{ claude_cli_path }}"
      - mcp
      - get
      - xcodebuildmcp
  changed_when: false
  register: claude_xcodebuildmcp_verify
  when: claude_cli_stat.stat.exists

- name: Show Claude XcodeBuildMCP config
  ansible.builtin.debug:
    var: claude_xcodebuildmcp_verify.stdout_lines
  when: claude_cli_stat.stat.exists

- name: Verify XcodeBuildMCP in Codex
  ansible.builtin.command:
    argv:
      - "{{ codex_cli_path }}"
      - mcp
      - get
      - xcodebuildmcp
  changed_when: false
  register: codex_xcodebuildmcp_verify
  when: codex_cli_stat.stat.exists

- name: Show Codex XcodeBuildMCP config
  ansible.builtin.debug:
    var: codex_xcodebuildmcp_verify.stdout_lines
  when: codex_cli_stat.stat.exists
