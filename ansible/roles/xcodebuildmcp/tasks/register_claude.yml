---
- name: Register XcodeBuildMCP server with Claude
  ansible.builtin.command:
    argv:
      - "{{ claude_cli_path }}"
      - mcp
      - add
      - -s
      - user
      - xcodebuildmcp
      - --
      - npx
      - -y
      - "{{ xcodebuildmcp_npx_package }}"
      - mcp
  changed_when: true
