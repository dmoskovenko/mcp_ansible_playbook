---
- name: Register Context7 MCP server with Claude
  ansible.builtin.command:
    argv:
      - "{{ claude_cli_path }}"
      - mcp
      - add
      - -s
      - user
      - -e
      - "CONTEXT7_API_KEY={{ vault_context7_api_key }}"
      - context7
      - --
      - npx
      - -y
      - "{{ context7_npx_package }}"
  changed_when: true
  no_log: true
