---
- name: Verify Context7 in Claude
  ansible.builtin.command:
    argv:
      - "{{ claude_cli_path }}"
      - mcp
      - get
      - context7
  changed_when: false
  register: claude_context7_verify
  when: claude_cli_stat.stat.exists

- name: Show Claude Context7 config
  ansible.builtin.debug:
    var: claude_context7_verify.stdout_lines
  when: claude_cli_stat.stat.exists

- name: Verify Context7 in Codex
  ansible.builtin.command:
    argv:
      - "{{ codex_cli_path }}"
      - mcp
      - get
      - context7
  changed_when: false
  register: codex_context7_verify
  when: codex_cli_stat.stat.exists

- name: Show Codex Context7 config
  ansible.builtin.debug:
    var: codex_context7_verify.stdout_lines
  when: codex_cli_stat.stat.exists
