---
- name: Register Context7 MCP server with Codex
  ansible.builtin.command:
    argv:
      - "{{ codex_cli_path }}"
      - mcp
      - add
      - context7
      - --env
      - "CONTEXT7_API_KEY={{ vault_context7_api_key }}"
      - --
      - npx
      - -y
      - "{{ context7_npx_package }}"
  changed_when: true
  no_log: true
