---
- name: Install Cupertino binary
  ansible.builtin.include_tasks: install.yml

- name: Register Cupertino with Claude
  ansible.builtin.include_tasks: register_claude.yml
  when: claude_cli_stat.stat.exists

- name: Register Cupertino with Codex
  ansible.builtin.include_tasks: register_codex.yml
  when: codex_cli_stat.stat.exists

- name: Verify Cupertino registration
  ansible.builtin.include_tasks: verify.yml
