---
- name: Tap Cupertino Homebrew repository
  community.general.homebrew_tap:
    name: "{{ cupertino_tap }}"
    state: present

- name: Install Cupertino formula
  community.general.homebrew:
    name: "{{ cupertino_formula }}"
    state: present

- name: Verify Cupertino binary exists
  ansible.builtin.stat:
    path: "{{ homebrew_prefix }}/bin/{{ cupertino_binary }}"
  register: cupertino_bin
  failed_when: not cupertino_bin.stat.exists
