---
- name: Register Cupertino MCP server with Claude
  ansible.builtin.command:
    argv:
      - "{{ claude_cli_path }}"
      - mcp
      - add
      - -s
      - user
      - -t
      - "{{ cupertino_transport }}"
      - cupertino
      - "{{ homebrew_prefix }}/bin/{{ cupertino_binary }}"
  changed_when: true
