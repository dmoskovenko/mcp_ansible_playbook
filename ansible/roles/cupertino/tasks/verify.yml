---
- name: Verify Cupertino in Claude
  ansible.builtin.command:
    argv:
      - "{{ claude_cli_path }}"
      - mcp
      - get
      - cupertino
  changed_when: false
  register: claude_cupertino_verify
  when: claude_cli_stat.stat.exists

- name: Show Claude Cupertino config
  ansible.builtin.debug:
    var: claude_cupertino_verify.stdout_lines
  when: claude_cli_stat.stat.exists

- name: Verify Cupertino in Codex
  ansible.builtin.command:
    argv:
      - "{{ codex_cli_path }}"
      - mcp
      - get
      - cupertino
  changed_when: false
  register: codex_cupertino_verify
  when: codex_cli_stat.stat.exists

- name: Show Codex Cupertino config
  ansible.builtin.debug:
    var: codex_cupertino_verify.stdout_lines
  when: codex_cli_stat.stat.exists
