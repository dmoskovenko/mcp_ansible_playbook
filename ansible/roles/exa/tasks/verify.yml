---
- name: Verify Exa in Claude
  ansible.builtin.command:
    argv:
      - "{{ claude_cli_path }}"
      - mcp
      - get
      - exa
  changed_when: false
  register: claude_exa_verify
  when: claude_cli_stat.stat.exists

- name: Show Claude Exa config
  ansible.builtin.debug:
    var: claude_exa_verify.stdout_lines
  when: claude_cli_stat.stat.exists

- name: Verify Exa in Codex
  ansible.builtin.command:
    argv:
      - "{{ codex_cli_path }}"
      - mcp
      - get
      - exa
  changed_when: false
  register: codex_exa_verify
  when: codex_cli_stat.stat.exists

- name: Show Codex Exa config
  ansible.builtin.debug:
    var: codex_exa_verify.stdout_lines
  when: codex_cli_stat.stat.exists
