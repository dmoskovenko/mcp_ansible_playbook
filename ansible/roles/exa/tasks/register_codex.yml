---
- name: Register Exa MCP server with Codex
  ansible.builtin.command:
    argv:
      - "{{ codex_cli_path }}"
      - mcp
      - add
      - exa
      - --env
      - "EXA_API_KEY={{ vault_exa_api_key }}"
      - --
      - npx
      - -y
      - "{{ exa_npx_package }}"
      - "--tools={{ exa_tools | join(',') }}"
  changed_when: true
  no_log: true
