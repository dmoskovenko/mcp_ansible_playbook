---
- name: Register Perplexity MCP server with Codex
  ansible.builtin.command:
    argv:
      - "{{ codex_cli_path }}"
      - mcp
      - add
      - perplexity
      - --env
      - "PERPLEXITY_API_KEY={{ vault_perplexity_api_key }}"
      - --
      - npx
      - -y
      - "{{ perplexity_npx_package }}"
  changed_when: true
  no_log: true
