---
- name: Verify Perplexity in Claude
  ansible.builtin.command:
    argv:
      - "{{ claude_cli_path }}"
      - mcp
      - get
      - perplexity
  changed_when: false
  register: claude_perplexity_verify
  when: claude_cli_stat.stat.exists

- name: Show Claude Perplexity config
  ansible.builtin.debug:
    var: claude_perplexity_verify.stdout_lines
  when: claude_cli_stat.stat.exists

- name: Verify Perplexity in Codex
  ansible.builtin.command:
    argv:
      - "{{ codex_cli_path }}"
      - mcp
      - get
      - perplexity
  changed_when: false
  register: codex_perplexity_verify
  when: codex_cli_stat.stat.exists

- name: Show Codex Perplexity config
  ansible.builtin.debug:
    var: codex_perplexity_verify.stdout_lines
  when: codex_cli_stat.stat.exists
