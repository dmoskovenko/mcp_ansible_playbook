---
- name: Install Node.js via Homebrew (required for npx-based servers)
  community.general.homebrew:
    name: node
    state: present
  when: >-
    'exa' in mcp_servers_enabled or
    'firecrawl' in mcp_servers_enabled or
    'perplexity' in mcp_servers_enabled or
    'context7' in mcp_servers_enabled or
    'xcodebuildmcp' in mcp_servers_enabled

- name: Install Claude Code via Homebrew cask
  community.general.homebrew_cask:
    name: "{{ claude_code_cask }}"
    state: present

- name: Install Codex via Homebrew cask
  community.general.homebrew_cask:
    name: "{{ codex_cask }}"
    state: present

- name: Install uv via Homebrew (required for uvx / SwiftLens)
  community.general.homebrew:
    name: uv
    state: present
  when: "'swiftlens' in mcp_servers_enabled"
