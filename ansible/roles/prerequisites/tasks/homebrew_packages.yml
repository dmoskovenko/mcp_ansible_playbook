---
- name: Install Node.js via Homebrew (required for npx-based servers)
  community.general.homebrew:
    name: node
    state: present
  when: mcp_servers_enabled | map('extract', mcp_servers) | selectattr('runner', 'eq', 'npx') | list | length > 0

- name: Install Claude Code via Homebrew cask
  community.general.homebrew_cask:
    name: "{{ claude_code_cask }}"
    state: present

- name: Install Codex via Homebrew cask
  community.general.homebrew_cask:
    name: "{{ codex_cask }}"
    state: present

- name: Install uv via Homebrew (required for uvx-based servers)
  community.general.homebrew:
    name: uv
    state: present
  when: mcp_servers_enabled | map('extract', mcp_servers) | selectattr('runner', 'eq', 'uvx') | list | length > 0
