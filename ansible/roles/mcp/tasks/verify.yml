---
- name: "Verify {{ mcp_server.name }} in Claude"
  ansible.builtin.command:
    argv:
      - "{{ claude_cli_path }}"
      - mcp
      - get
      - "{{ mcp_server.name }}"
  changed_when: false
  register: claude_mcp_verify
  when: claude_cli_stat.stat.exists

- name: "Show Claude {{ mcp_server.name }} config"
  ansible.builtin.debug:
    var: claude_mcp_verify.stdout_lines
  when: claude_cli_stat.stat.exists

- name: "Verify {{ mcp_server.name }} in Codex"
  ansible.builtin.command:
    argv:
      - "{{ codex_cli_path }}"
      - mcp
      - get
      - "{{ mcp_server.name }}"
  changed_when: false
  register: codex_mcp_verify
  when:
    - codex_cli_stat.stat.exists
    - mcp_server.codex | default(true) | bool

- name: "Show Codex {{ mcp_server.name }} config"
  ansible.builtin.debug:
    var: codex_mcp_verify.stdout_lines
  when:
    - codex_cli_stat.stat.exists
    - mcp_server.codex | default(true) | bool
