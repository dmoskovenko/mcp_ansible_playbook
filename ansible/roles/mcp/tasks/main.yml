---
- name: "Validate {{ mcp_server.name }} API key is set"
  ansible.builtin.assert:
    that:
      - mcp_server.env.value | length > 0
    fail_msg: >-
      {{ mcp_server.name }} requires {{ mcp_server.env.key }} but it is empty.
      Load the vault: -e @vars/vault.yml --ask-vault-pass
  when: mcp_server.env is defined

- name: "Install {{ mcp_server.name }} via Homebrew"
  ansible.builtin.include_tasks: install_homebrew.yml
  when: mcp_server.homebrew is defined

- name: "Register {{ mcp_server.name }} with Claude"
  ansible.builtin.include_tasks: register_claude.yml
  when: claude_cli_stat.stat.exists

- name: "Register {{ mcp_server.name }} with Codex"
  ansible.builtin.include_tasks: register_codex.yml
  when:
    - codex_cli_stat.stat.exists
    - mcp_server.codex | default(true) | bool

- name: "Verify {{ mcp_server.name }} registration"
  ansible.builtin.include_tasks: verify.yml
