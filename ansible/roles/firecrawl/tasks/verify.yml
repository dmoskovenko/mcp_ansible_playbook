---
- name: Verify Firecrawl in Claude
  ansible.builtin.command:
    argv:
      - "{{ claude_cli_path }}"
      - mcp
      - get
      - firecrawl
  changed_when: false
  register: claude_firecrawl_verify
  when: claude_cli_stat.stat.exists

- name: Show Claude Firecrawl config
  ansible.builtin.debug:
    var: claude_firecrawl_verify.stdout_lines
  when: claude_cli_stat.stat.exists

- name: Verify Firecrawl in Codex
  ansible.builtin.command:
    argv:
      - "{{ codex_cli_path }}"
      - mcp
      - get
      - firecrawl
  changed_when: false
  register: codex_firecrawl_verify
  when: codex_cli_stat.stat.exists

- name: Show Codex Firecrawl config
  ansible.builtin.debug:
    var: codex_firecrawl_verify.stdout_lines
  when: codex_cli_stat.stat.exists
