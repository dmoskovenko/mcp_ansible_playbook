---
- name: Register Firecrawl MCP server with Codex
  ansible.builtin.command:
    argv:
      - "{{ codex_cli_path }}"
      - mcp
      - add
      - firecrawl
      - --env
      - "FIRECRAWL_API_KEY={{ vault_firecrawl_api_key }}"
      - --
      - npx
      - -y
      - "{{ firecrawl_npx_package }}"
  changed_when: true
  no_log: true
